name: Refresh dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  refresh-data:
    name: Run Python data refresh
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build dashboard data
        run: python src/build_all.py

      - name: Commit refreshed generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed data/raw/power data/raw/carbon/eua_auction_results.csv data/raw/carbon/uk_ets_ccm_monthly_prices.csv data/source_register.csv outputs

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi

          git commit -m "Refresh generated dashboard data"
          git push
