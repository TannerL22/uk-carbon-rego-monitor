name: Refresh dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  refresh-data:
    name: Run Python data refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Check out the branch tip at run time (not the triggering commit) so a run
      # queued behind another refresh builds on top of that refresh's data.
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show refresh scope
        run: |
          echo "GitHub Pages serves static files only."
          echo "This workflow runs the normal build and commits generated/fetched outputs."
          echo "Manual/demo inputs are intentionally not regenerated by this workflow."

      - name: Run offline tests
        run: python -m unittest discover -s tests -t .

      # A failed public-source fetch keeps the previous extract, is recorded in
      # data/processed/build_status.json and shown on the dashboard (SC-010).
      # The run is still marked failed by the last step, after committing.
      - name: Build dashboard data
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          TRADING_ECONOMICS_CARBON_SYMBOL: EECXM:IND
        run: python src/build_all.py --allow-fetch-failures

      - name: Commit refreshed generated and public-source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/commit-refresh.sh "${GITHUB_REF_NAME}"

      - name: Fail run if any public-source fetch failed
        shell: bash
        run: |
          python - <<'EOF'
          import json, sys
          status = json.load(open("data/processed/build_status.json", encoding="utf-8"))
          failures = status.get("failed_steps", [])
          for item in failures:
              print(f"::error title={item['step']} fetch failed::{item['error']}")
          sys.exit(1 if failures else 0)
          EOF
