name: Refresh dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  refresh-data:
    name: Run Python data refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show refresh scope
        run: |
          echo "GitHub Pages serves static files only."
          echo "This workflow runs the normal build and commits generated/fetched outputs."
          echo "Manual/demo inputs are intentionally not regenerated by this workflow."

      - name: Build dashboard data
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          TRADING_ECONOMICS_CARBON_SYMBOL: EECXM:IND
        run: python src/build_all.py

      - name: Commit refreshed generated and public-source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed \
            data/raw/power/neso_carbon_intensity_api_raw.json \
            data/raw/power/neso_fetch_metadata.json \
            data/raw/power/neso_generation_mix_live.csv \
            data/raw/carbon/eua_auction_results.csv \
            data/raw/carbon/uk_ets_ccm_monthly_prices.csv \
            data/source_register.csv

          if [ -f data/raw/carbon/trading_economics_eu_carbon_reference.csv ]; then
            git add data/raw/carbon/trading_economics_eu_carbon_reference.csv
          fi

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi

          echo "Committing refreshed generated/public-source files:"
          git diff --cached --name-only
          git commit -m "Refresh generated dashboard data"
          git push
