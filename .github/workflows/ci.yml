name: Validate project

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Run syntax and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q src tests

      # Tests run the pipeline against a temporary copy of data/, so they never
      # modify tracked files. The network smoke test is skipped unless
      # RUN_NETWORK_TESTS=1 is set.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check dashboard JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/charts.js
