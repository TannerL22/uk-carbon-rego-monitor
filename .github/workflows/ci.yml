name: Validate project

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Run syntax and REGO checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall src tests

      - name: Run REGO, claim coverage, and FMD context tests
        run: python -m unittest tests.test_rego_controls tests.test_customer_claim_coverage tests.test_fmd_context

      - name: Check dashboard JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/charts.js
